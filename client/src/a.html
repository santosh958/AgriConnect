<!DOCTYPE html>
<html>
<head>
  <title>DOM Events Demo</title>
  <script>
    function over()
    {
      document.getElementById('butt').style.cursor="pointer";
      document.getElementById('butt').style.backgroundColor="yellow";
    }
  </script>
</head>
<body >
  <button id="butt" onmouseover="over()">Button</button>
</body>
</html>
